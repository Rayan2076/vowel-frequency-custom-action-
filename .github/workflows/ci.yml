name: Vowel Frequency Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Docker-based vowel frequency analyzer
        uses: ./.github/actions/vowel-frequency-analyzer
        with:
          file: data.txt
